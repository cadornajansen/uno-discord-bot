name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest --tb=short -q

      - name: Compile Python modules
        run: python -m compileall -q bot config main.py

      - name: Validate production Compose file
        env:
          UNO_ENV_FILE: deploy/azure/.env.azure-vm.example
        run: docker compose -f compose.azure-vm.yml config --quiet

      - name: Build production image
        run: docker build --tag uno-ci:${{ github.sha }} .
