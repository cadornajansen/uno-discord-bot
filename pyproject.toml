[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uno-discord-bot"
version = "0.1.0"
description = "Discord bot foundation for Computer Science block section"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "discord.py>=2.3.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "qdrant-client>=1.7.3",
    "pdf-inspector>=0.2.6",
    "python-pptx>=1.0.2",
    "tzdata>=2024.1",
    "beautifulsoup4>=4.12.0",
    "rapidocr-onnxruntime>=1.3.0",
    "onnxruntime>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*", "config*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
